<!DOCTYPE html>
<html lang="{{ locale }}">

<head>
    <link rel="icon" type="image/png" href="https://metin2pserver.net/assets/img/fav.png" />
    <style>
        html {
            /*filter: invert(1) hue-rotate(40deg);*/
        }

        body {
            background-color: transparent;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        @-webkit-keyframes shake {
            0% {
                -webkit-transform: translateX(0);
            }

            25% {
                -webkit-transform: translateX(-5px);
            }

            50% {
                -webkit-transform: translateX(5px);
            }

            75% {
                -webkit-transform: translateX(-5px);
            }

            100% {
                -webkit-transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.6s;
            -webkit-animation: shake 0.6s;
        }

        .wrapper {
            width: 200px;
            height: 60px;
            border: solid red 2px;
            border-radius: 8px;
            background-color: #eee;
        }

        .wrapper-good {
            border: solid green 3px;
        }

        .checkbox-wrapper-55 input[type="checkbox"] {
            visibility: hidden;
            display: none;
        }

        .checkbox-wrapper-55 *,
        .checkbox-wrapper-55 ::after,
        .checkbox-wrapper-55 ::before {
            box-sizing: border-box;
        }

        .checkbox-wrapper-55 .rocker {
            display: inline-block;
            position: relative;
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            color: #888;
            width: 14em;
            height: 4em;
            overflow: hidden;
            border-bottom: 0.5em solid #eee;
        }

        .checkbox-wrapper-55 .rocker-small {
            font-size: 0.8em;
        }

        .checkbox-wrapper-55 .rocker::before {
            content: "";
            position: absolute;
            top: 0.5em;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #999;
            border: 0.5em solid #eee;
            border-bottom: 0;
        }

        .checkbox-wrapper-55 .switch-left,
        .checkbox-wrapper-55 .switch-right {
            cursor: pointer;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 2.5em;
            width: 7em;
            transition: 0.2s;
            user-select: none;
        }

        .checkbox-wrapper-55 .switch-left {
            height: 2.4em;
            left: 0.85em;
            bottom: 0.4em;
            background-color: #ddd;
            transform: rotate(15deg) skewX(15deg);
        }

        .checkbox-wrapper-55 .switch-right {
            right: 0.5em;
            bottom: 0;
            background-color: #bd5757;
            color: #fff;
        }

        .checkbox-wrapper-55 .switch-left::before,
        .checkbox-wrapper-55 .switch-right::before {
            content: "";
            position: absolute;
            width: 0.4em;
            height: 2.45em;
            bottom: -0.45em;
            background-color: #ccc;
            transform: skewY(-65deg);
        }

        .checkbox-wrapper-55 .switch-left::before {
            left: -0.4em;
        }

        .checkbox-wrapper-55 .switch-right::before {
            right: -0.375em;
            background-color: transparent;
            transform: skewY(65deg);
        }

        .checkbox-wrapper-55 input:checked+.switch-left {
            background-color: #0084d0;
            color: white;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-thickness: 4px;
            text-decoration-style: dotted;
            text-decoration-color: greenyellow;
            bottom: 0px;
            left: 0.5em;
            height: 2.5em;
            width: 7em;
            transform: rotate(0deg) skewX(0deg);
        }

        .checkbox-wrapper-55 .switch-left:hover {
            text-decoration: underline;
            text-decoration-thickness: 4px;
            text-decoration-style: dotted;
            text-decoration-color: greenyellow;
        }

        .checkbox-wrapper-55 input:checked+.switch-left::before {
            background-color: transparent;
            width: 7em;
        }

        .checkbox-wrapper-55 input:checked+.switch-left+.switch-right {
            background-color: #ddd;
            color: #888;
            bottom: 0.4em;
            right: 0.8em;
            height: 2.4em;
            width: 7em;
            transform: rotate(-15deg) skewX(-15deg);
        }

        .checkbox-wrapper-55 input:checked+.switch-left+.switch-right::before {
            background-color: #ccc;
        }

        /* Keyboard Users */
        .checkbox-wrapper-55 input:focus+.switch-left {
            color: #333;
        }

        .checkbox-wrapper-55 input:checked:focus+.switch-left {
            color: #fff;
        }

        .checkbox-wrapper-55 input:focus+.switch-left+.switch-right {
            color: #fff;
        }

        .checkbox-wrapper-55 input:checked:focus+.switch-left+.switch-right {
            color: #333;
        }

        .switch-left {
            color: green;
        }
    </style>
    <script>
        if (!document.attachEvent)
            document.attachEvent = function (event, callback) {
                return document.addEventListener(event.replace(/^on/, ''), callback);
            };

        document.attachEvent('DOMContentLoaded', function () {
            var timeout = setTimeout(function () {
                window.location.reload();
            }, 1000 * 60 * 3);

            document.attachEvent('mousemove', function () {
                clearTimeout(timeout);
                timeout = setTimeout(function () {
                    window.location.reload();
                }, 1000 * 60 * 3);
            });

            var checkbox = document.querySelector('.checkbox-wrapper-55 input[type="checkbox"]');
            if (!checkbox.attachEvent)
                checkbox.attachEvent = function (event, callback) {
                    return document.addEventListener(event.replace(/^on/, ''), callback);
                };

            checkbox.attachEvent('change', function () {
                if (checkbox.checked) {
                    checkbox.disabled = true;

                    document.querySelector(".wrapper").className += ' wrapper-good';

                    var element_name = (function () {
                        var query = window.location.search.substring(1);
                        var vars = query.split("&");
                        for (var i = 0; i < vars.length; i++) {
                            var pair = vars[i].split("=");
                            if (pair[0] == "element_name")
                                return pair[1];
                        }
                        return false;
                    })();

                    window.top.postMessage('captcha_url;' + element_name + ";" + "/captcha/display/{{ sitekey }}/{{ sitekey_hash }}", '*');
                }
            });

            function shake() {
                var wrapper = document.querySelector('.checkbox-wrapper-55');
                wrapper.className += ' shake';
                wrapper.className = wrapper.className.replace(' wrapper-good', '');
                setTimeout(function () {
                    wrapper.className = wrapper.className.replace(' shake', '');
                }, 600);
            }

            function praseMsg(msg) {
                if (msg.indexOf('shake') === 0) {
                    shake();
                } else if (msg.indexOf('reset_captcha_checkbox') === 0) {
                    checkbox.disabled = false;
                    checkbox.checked = false;
                    document.querySelector(".wrapper").className = document.querySelector(".wrapper").className.replace(' wrapper-good', '');
                }
            }

            if (window.attachEvent) {
                window.attachEvent('onmessage', function (e) {
                    praseMsg(e.data);
                });
            } else {
                window.addEventListener('message', function (e) {
                    praseMsg(e.data);
                });
            }
        });
    </script>
</head>

<body>
    <div class="wrapper">
        <div class="checkbox-wrapper-55">
            <label class="rocker rocker-small">
                <input type="checkbox" class="recapcha-checkbox" required>
                <span class="switch-left">Human</span>
                <span class="switch-right">🤖Robot</span>
            </label>
        </div>
    </div>
</body>

</html>
